name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore EduGest.sln
      - name: Build
        run: dotnet build EduGest.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test EduGest.sln --configuration Release --no-build
      - name: Install EF Core CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: dotnet tool install --global dotnet-ef --version 8.0.11
      - name: Generate pending EF Core migration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          dotnet ef migrations add AutoMigration --project src/EduGest.Infrastructure/EduGest.Infrastructure.csproj --startup-project src/EduGest.Api/EduGest.Api.csproj --output-dir Persistence/Migrations
          $migration = Get-ChildItem "src/EduGest.Infrastructure/Persistence/Migrations/*_AutoMigration.cs" | Select-Object -First 1
          if ($null -ne $migration) {
            $content = Get-Content $migration.FullName -Raw
            if ($content -match "migrationBuilder\.(CreateTable|AddColumn|AlterColumn|DropColumn|DropTable|CreateIndex|AddForeignKey)") {
              git add src/EduGest.Infrastructure/Persistence/Migrations
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "chore: ajouter la migration EF Core en attente"
              git push
            } else {
              dotnet ef migrations remove --force --project src/EduGest.Infrastructure/EduGest.Infrastructure.csproj --startup-project src/EduGest.Api/EduGest.Api.csproj
            }
          }
